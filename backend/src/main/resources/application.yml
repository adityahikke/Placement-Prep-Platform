server:
  port: 8080

spring:
  application:
    name: placementprep-backend
  datasource:
    # --- MySQL Database Configuration ---
    # Automatically creates 'placement_prep' database if it doesn't exist
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/placement_prep?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:Adi123*#}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update # Automatically creates and updates tables
    show-sql: false
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      fail-on-empty-beans: false
  servlet:
    multipart:
      # Allows reasonably large question-bank spreadsheets for admin bulk upload.
      max-file-size: 10MB
      max-request-size: 12MB

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  google:
    # Comma-separated list of accepted Google OAuth 2.0 Client IDs (Web application type).
    # Matches VITE_GOOGLE_CLIENT_ID in frontend/.env
    client-id: ${GOOGLE_CLIENT_ID:821144344369-52qf8tvtmf44l8ejmkdstoktco2bcqe8.apps.googleusercontent.com}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.placementprep: INFO
    org.springframework.security: WARN
